# Members get only the resource CLI; admins keep their existing auth and shell.
# The member shell is root-owned and ignores the command passed by sshd; the
# login wrapper reads SSH_ORIGINAL_COMMAND instead.
Match Group citespec-members
    ForceCommand /usr/local/bin/citespec-resource-login
    Banner /etc/ssh/citespec-resource-banner.txt
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PermitEmptyPasswords no
    PermitUserRC no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY yes
    # Root-managed per-member key file installed by the provisioning executor.
    # There is deliberately NO ~/.ssh/authorized_keys fallback: members cannot
    # restore revoked access by editing their home directory. Validate with
    # `sshd -T -C user=<member>,host=<host>,addr=<addr>` before reload.
    AuthorizedKeysFile /etc/citespec-resource/authorized-keys.d/%u
