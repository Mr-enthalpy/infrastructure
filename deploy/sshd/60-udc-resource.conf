# Members get only the resource CLI; admins keep their existing auth and shell.
# The member shell is root-owned and ignores the command passed by sshd; the
# login wrapper reads SSH_ORIGINAL_COMMAND instead.
Match Group udc-members
    ForceCommand /usr/local/bin/udc-resource-login
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PermitEmptyPasswords no
    PermitUserRC no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitUserEnvironment no
    PermitTTY yes
