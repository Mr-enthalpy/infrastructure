# Members get only the resource CLI; admins keep their existing auth and shell.
# The member shell is root-owned and ignores the command passed by sshd; the
# login wrapper reads SSH_ORIGINAL_COMMAND instead.
Match Group udc-members
    ForceCommand /usr/local/bin/udc-resource-login
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PermitEmptyPasswords no
    PermitUserRC no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitUserEnvironment no
    PermitTTY yes
# Central member key file (goal member-onboarding-and-ux.md §8.3): root-managed
# per-member key files installed by the provisioning executor. Commented until
# the central-key deployment is verified on the target host; when enabled it
# PREPENDS to the default AuthorizedKeysFile order and must be validated with
# `sshd -T -C user=<member>,host=<host>,addr=<addr>` before reload.
# Match Group udc-members
#     AuthorizedKeysFile /etc/udc-resource/authorized-keys.d/%u .ssh/authorized_keys
