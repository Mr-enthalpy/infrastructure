# Example-only configuration used by tests and documentation. Values are not a
# claim about any live host or its current inventory.
[server]
name = "example"
ssh_alias = "example"
address = "server.example.invalid"
ssh_port = 22
ssh_user = "admin"
known_hosts = "~/.ssh/known_hosts"
data_root = "/data1"
workspace_root = "/home/data1/citespec-users"
broker_socket = "/run/citespec-resource/broker.sock"
state_db = "/var/lib/citespec-resource/state.db"
members_file = "/etc/citespec-resource/members.toml"
# Root-only key that encrypts broker-side administrator TOTP secrets.
admin_auth_key_file = "/etc/citespec-resource/broker-admin.key"
# Fresh password + TOTP attestations are single-use and short-lived.
admin_attestation_ttl_seconds = 120

[hardware]
gpu_count = 8
gpu_model = "NVIDIA GeForce RTX 4090"
gpu_memory_mib = 49140
cpu_logical = 128
ram_gib = 251
docker_version = "28.1.1"
python_version = "3.10.12"

[policy]
default_hours = 12
max_hours = 36
mode = "monitor"
deployment_allowed = false
global_max_cpus = 120
global_max_memory_gb = 219
max_cpus_per_allocation = 32
max_memory_gb_per_allocation = 128
max_cpus_per_user = 64
max_memory_gb_per_user = 192
reserve_cpus = 8
reserve_memory_gb = 32
max_gpus_per_user = 4
max_active_allocations_per_user = 4
# Gates only the Broker's restricted file put/get API (bounded by
# max_upload_bytes). Container-internal SFTP over the VS Code tunnel is NOT
# gated by this; workspace quotas are the actual disk protection.
file_transfer_enabled = false
max_upload_bytes = 21474836480
min_free_gb = 50
max_workspace_gb = 200
workspace_quota_required = true
pids_limit = 4096
container_user = "member"
container_read_only = false
container_profile = "development"
container_sudo = true
writable_layer_gb = 40
container_home = ""
# 0 = HOME lives in the quota-bounded writable layer and vanishes with the
# container. Set > 0 for a tmpfs HOME of that size in GiB (consumes container
# memory; only prefer it if the writable-layer quota is not enough).
container_home_tmpfs_gb = 0
# Free space the Docker storage directory must keep before any new allocation
# (protects the OS and Docker metadata from many quota-bounded containers
# filling the disk together). Admission additionally requires that the CURRENT
# free space can absorb the writable-layer entitlements already promised to
# live allocations plus the candidate — the budget below is also checked
# against the filesystem's total capacity.
min_free_docker_gb = 20
# Global writable-layer budget: every development allocation reserves its
# writable_layer_gb here (pending or active), so several quota-bounded
# containers cannot together oversubscribe the disk. Set this below the disk
# space that images, non-Citespec containers, and the OS reserve.
docker_storage_budget_gb = 500
userns_mode = ""
legacy_audit_required = true
legacy_audit_script = "/usr/local/libexec/citespec-resource/audit_legacy.sh"
legacy_audit_timeout = 120
gpu_audit_required = true
gpu_audit_script = "/usr/local/libexec/citespec-resource/verify_gpu_permissions.sh"
gpu_audit_timeout = 180
gpu_audit_interval = 300
allow_root_ssh_keys = false
queue_enabled = true
max_queue_length = 100
max_queued_allocations_per_user = 4
max_queue_hours = 24
# Backfill: a queued request whose GPUs are all free may run past a blocked
# head, but it never gets a GPU an earlier request is waiting on. Once a
# blocked request has waited this many minutes, backfilling stops so it is
# served first (0 = strict FIFO, no backfill).
queue_backfill_enabled = true
queue_backfill_reserve_minutes = 30
# Enable only after the target-host container-sshd and tunnel acceptance tests pass.
vscode_enabled = false
vscode_max_tunnels = 8
vscode_identity_file = ""
# Hard caps for long-lived shell/tunnel streams. Idle terminals use dedicated
# bounded worker pools and can never starve release/expiry/audit work.
max_shells_per_user = 2
max_shells_global = 16
max_tunnels_per_user = 8
max_tunnels_global = 16

[groups]
members = "citespec-members"
cli = "citespec-cli"
admins = "citespec-admins"
gpu = "citespec-gpu"
portal = "citespec-portal"

[image]
base = "citespec-base:2026.10"
allowlist = []

[deployment]
reason = "example-gpu is still training; deploy only after explicit approval"
monitor_only_until = ""

[gui]
admin_ssh = ""
connect_timeout = 15

[onboarding]
# HTTPS entry points; published only after DNS/VPN/certificate work is done.
guide_url = ""
apply_url = ""
portal_url = ""

[portal]
# C1: the portal is VPN-only and binds loopback behind host nginx (:8770).
# Keep disabled until the network/certificate prerequisites in
# docs/server-network-request.md are answered and accepted.
enabled = false
bind_host = "127.0.0.1"
bind_port = 8770
db_path = "/var/lib/citespec-resource-portal/portal.db"
secret_file = "/etc/citespec-resource/portal-secret.key"
# Final value: https://citespec-portal.<lab-domain>
base_url = ""
session_ttl_hours = 12
activation_ttl_hours = 24
login_max_attempts = 5
login_window_seconds = 900
cookie_secure = true
registration_enabled = true
totp_issuer = "Citespec"
trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]
max_body_bytes = 65536