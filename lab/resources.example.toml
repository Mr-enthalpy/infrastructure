[server]
name = "amax"
ssh_alias = "amax"
address = "server.example.invalid"
ssh_port = 22
ssh_user = "admin"
known_hosts = "~/.ssh/known_hosts"
data_root = "/data1"
workspace_root = "/data1/udc-users"
broker_socket = "/run/udc-resource/broker.sock"
state_db = "/var/lib/udc-resource/state.db"
members_file = "/etc/udc-resource/members.toml"

[hardware]
gpu_count = 8
gpu_model = "NVIDIA GeForce RTX 4090"
gpu_memory_mib = 49140
cpu_logical = 128
ram_gib = 251
docker_version = "28.1.1"
python_version = "3.10.12"

[policy]
default_hours = 12
max_hours = 36
mode = "monitor"
deployment_allowed = false
global_max_cpus = 120
global_max_memory_gb = 219
max_cpus_per_allocation = 32
max_memory_gb_per_allocation = 128
max_cpus_per_user = 64
max_memory_gb_per_user = 192
reserve_cpus = 8
reserve_memory_gb = 32
max_gpus_per_user = 4
max_active_allocations_per_user = 4
file_transfer_enabled = false
max_upload_bytes = 21474836480
min_free_gb = 50
max_workspace_gb = 200
workspace_quota_required = true
pids_limit = 4096
container_user = "member"
container_read_only = false
container_profile = "development"
container_sudo = true
writable_layer_gb = 40
container_home = ""
# 0 = HOME lives in the quota-bounded writable layer and vanishes with the
# container. Set > 0 for a tmpfs HOME of that size in GiB (consumes container
# memory; only prefer it if the writable-layer quota is not enough).
container_home_tmpfs_gb = 0
# Free space the Docker storage directory must keep before any new allocation
# (protects the OS and Docker metadata from many quota-bounded containers
# filling the disk together).
min_free_docker_gb = 20
userns_mode = ""
legacy_audit_required = true
legacy_audit_script = "/usr/local/libexec/udc-resource/audit_legacy.sh"
legacy_audit_timeout = 120
gpu_audit_required = true
gpu_audit_script = "/usr/local/libexec/udc-resource/verify_gpu_permissions.sh"
gpu_audit_timeout = 180
gpu_audit_interval = 300
allow_root_ssh_keys = false
queue_enabled = true
max_queue_length = 100
max_queued_allocations_per_user = 4
max_queue_hours = 24
# Enable only after the target-host container-sshd and tunnel acceptance tests pass.
vscode_enabled = false
vscode_max_tunnels = 8
vscode_identity_file = ""

[groups]
members = "udc-members"
cli = "udc-cli"
admins = "udc-admins"
gpu = "udc-gpu"

[image]
base = "udc-base:2026.10"
allowlist = []

[deployment]
reason = "amax is still training; deploy only after explicit approval"
monitor_only_until = ""

[gui]
admin_ssh = ""
connect_timeout = 15