[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "citespec-resource"
version = "0.2.0"
description = "Timed, non-preemptive shared GPU resource broker for the Citespec lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7,<8",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gui = [
  "aiohttp>=3.10,<4",
  "asyncssh>=2.16,<3",
]
portal = [
  "aiohttp>=3.10,<4",
  "argon2-cffi>=23,<26",
  "cryptography>=42,<51",
  "jinja2>=3.1,<4",
  "pyotp>=2.9,<3",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.10",
]
browser = [
  "playwright>=1.45",
]

[project.scripts]
citespec-resource = "citespec_resource.cli:app"
citespec-resource-login = "citespec_resource.login_wrapper:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["citespec_resource*"]

[tool.setuptools.package-data]
citespec_resource = [
  "gui/static/**/*",
  "enrollment/static/**/*",
  "portal/static/**/*",
  "portal/templates/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "linux: requires Linux-only features such as SO_PEERCRED or Unix sockets",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/citespec_resource/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
