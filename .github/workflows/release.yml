name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,portal]" pyinstaller
      - name: Check tag version
        run: python packaging/check_version.py --tag "${{ github.ref_name }}"
      - name: Build client
        run: python packaging/build_client.py --platform ${{ matrix.platform }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}
          path: |
            dist/citespec-resource-*-${{ matrix.platform }}.zip
            dist/citespec-resource-*-${{ matrix.platform }}-full.zip
          if-no-files-found: error

  release:
    name: sign manifest and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,portal]"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create signed manifest
        env:
          CITESPEC_UPDATE_SIGNING_KEY: ${{ secrets.CITESPEC_UPDATE_SIGNING_KEY }}
        run: |
          python packaging/make_manifest.py \
            --artifacts-dir release-assets \
            --version "${GITHUB_REF_NAME#v}" \
            --output release-assets/citespec-resource-manifest.json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - name: Add standalone first-install verifier
        run: |
          cp packaging/verify_release.py packaging/verify_release.sh \
            packaging/verify_release.ps1 release-assets/
          chmod +x release-assets/verify_release.sh
      - name: Verify released full packages against the signed manifest
        run: |
          for platform in windows-x64 linux-x64; do
            python packaging/verify_release.py \
              --manifest release-assets/citespec-resource-manifest.json \
              --package "release-assets/citespec-resource-${GITHUB_REF_NAME#v}-${platform}-full.zip" \
              --platform "$platform"
          done
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
